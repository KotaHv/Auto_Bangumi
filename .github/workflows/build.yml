name: Build Docker

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync --frozen
      - name: Test
        working-directory: ./backend/src
        run: |
          mkdir -p config
          uv run --frozen pytest

  webui-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2
        name: Install bun
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v6
        name: Setup bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('webui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: cd webui && bun install --frozen-lockfile

      - name: Build test
        run: |
          cd webui && bun run build

  version-info:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            echo "Unsupported workflow event: $EVENT_NAME"
            exit 1
          fi

          if [ -z "$version" ]; then
            echo "Version is required."
            exit 1
          fi

          echo "Using version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.version }}

  build-webui:
    runs-on: ubuntu-latest
    needs: [test, webui-test, version-info]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2
        name: Install bun
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v6
        name: Setup bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('webui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: cd webui && bun install --frozen-lockfile

      - name: Build
        run: |
          cd webui && bun run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: webui/dist

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-webui, version-info]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Version info via tag
        working-directory: ./backend/src
        run: |
          echo "VERSION='${{ needs.version-info.outputs.version }}'" >> module/__version__.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (dev)
        id: meta-dev
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version-info.outputs.version }}
            type=raw,value=dev
        if: contains(needs.version-info.outputs.version, 'dev')

      - name: Docker metadata (release)
        id: meta-release
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version-info.outputs.version }}
            type=raw,value=latest
        if: contains(needs.version-info.outputs.version, 'dev') == false

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: backend/src/dist

      - name: Build and push (dev)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.output.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
        if: contains(needs.version-info.outputs.version, 'dev')

      - name: Build and push (release)
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.output.name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-release.outputs.tags }}
          labels: ${{ steps.meta-release.outputs.labels }}
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
        if: contains(needs.version-info.outputs.version, 'dev') == false
